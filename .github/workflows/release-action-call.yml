name: Release action
# Call the reusable workflow release-solution-with-inputs.yml
# Release your solution to prod when you create a new release.

on:
  release:
      types: [created]        
permissions:
  contents: write
jobs:
  Release-solution-ALMLab:
    uses: ./.github/workflows/release-solution-to-prod-with-inputs.yml
    with:
      #You can specify the solution name here
      solution_name: GilbertoTest
      #Update your values here
    
    secrets:
      BUILD_ENVIRONMENT_URL: ${{ secrets.PP_ENV_DEV_URL }}
      PRODUCTION_ENVIRONMENT_URL: ${{ secrets.PP_ENV_TARGET_URL }}
      CLIENT_ID: ${{ secrets.PP_APP_ID }}
      TENANT_ID: ${{ secrets.PP_TENANT_ID }}  
      envSecret: ${{ secrets.PP_CLIENT_SECRET }}
