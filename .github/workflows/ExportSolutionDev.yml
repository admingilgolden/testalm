name: Export and Branch Solution (SPN Auth)

on:
  workflow_dispatch:
    inputs:
      solution_name:
        description: "Name of the solution to export"
        required: true
      branch_name:
        description: "Branch to push changes to"
        required: true

jobs:
  export-and-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Power Platform CLI
        run: npm install -g @microsoft/powerplatform-cli

      - name: Authenticate with Service Principal
        run: |
          pac auth create \
            --url ${{ secrets.PP_ENV_URL }} \
            --applicationId ${{ secrets.PP_APP_ID }} \
            --clientSecret ${{ secrets.PP_CLIENT_SECRET }} \
            --tenant ${{ secrets.PP_TENANT_ID }}

      - name: Export solution
        run: |
          pac solution export \
            --name "${{ github.event.inputs.solution_name }}" \
            --path ./exported-solution.zip \
            --managed false \
            --overwrite

      - name: Unpack solution
        run: |
          pac solution unpack \
            --zipfile ./exported-solution.zip \
            --folder ./solutions/${{ github.event.inputs.solution_name }} \
            --allowDelete true

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -B "${{ github.event.inputs.branch_name }}"
          git add .
          git commit -m "Exported solution: ${{ github.event.inputs.solution_name }}"
          git push origin "${{ github.event.inputs.branch_name }}" --force
